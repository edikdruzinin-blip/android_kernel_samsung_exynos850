name: Build KernelSU Kernel for SM-M127F

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          git bc bison flex libssl-dev make libc6-dev libncurses5-dev \
          crossbuild-essential-arm64 python3 python2 zip unzip \
          libelf-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
          clang lld llvm

    - name: Clone kernel source
      run: |
        git clone --depth=1 \
          https://github.com/samsungexynos850/android_kernel_samsung_exynos850 \
          kernel

    - name: Apply KernelSU patch
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
        echo "KernelSU applied"
        ls KernelSU/

    - name: Show available defconfigs
      run: ls kernel/arch/arm64/configs/

    - name: Configure kernel
      run: |
        cd kernel
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        DEFCONFIG=$(ls arch/arm64/configs/ | grep -i "m127\|a12s\|universal3830\|exynos850\|3830" | head -1)
        echo "Using defconfig: $DEFCONFIG"
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- $DEFCONFIG
        echo "CONFIG_KSU=y" >> .config
        echo "CONFIG_OVERLAY_FS=y" >> .config
        echo "CONFIG_KPROBES=y" >> .config
        echo "CONFIG_HAVE_KPROBES=y" >> .config
        echo "CONFIG_KPROBE_EVENTS=y" >> .config
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

    - name: Build kernel
      run: |
        cd kernel
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) 2>&1 | tail -50
        ls -lh arch/arm64/boot/Image

    - name: Package with AnyKernel3
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3 anykernel
        cp kernel/arch/arm64/boot/Image anykernel/
        cat > anykernel/anykernel.sh << 'AKEOF'
kernel.string=KernelSU Kernel for SM-M127F
do.devicecheck=1
do.modules=0
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.name1=m12
device.name2=m12nacho
device.name3=SM-M127F
supported.versions=11
. tools/ak3-core.sh
dump_boot;
patch_cmdline "androidboot.selinux" "androidboot.selinux=permissive";
patch_cmdline "selinux" "selinux=0";
patch_cmdline "enforcing" "enforcing=0";
patch_cmdline "zram.num_devices" "zram.num_devices=4";
write_boot;
AKEOF
        cd anykernel
        zip -r9 ../m127f_kernelsu.zip . -x "*.git*" "*.github*"
        ls -lh ../m127f_kernelsu.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: m127f_kernelsu
        path: m127f_kernelsu.zip
        retention-days: 7
